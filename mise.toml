[tools]
typst = "latest"
pandoc = "latest"

[tasks.html]
description = "Render guide.md to docs/index.html"
run = "mkdir -p docs && pandoc guide.md -s --lua-filter=header-links.lua --embed-resources --css style.css -o docs/index.html"

[tasks.pdf]
description = "Render guide.md to docs/guide.pdf (via Typst)"
run = "mkdir -p docs && pandoc guide.md --pdf-engine=typst --include-in-header=typst-header.typ --metadata-file=pdf-meta.yaml -o docs/guide.pdf"

[tasks.build]
description = "Build HTML and PDF"
depends = ["html", "pdf"]
